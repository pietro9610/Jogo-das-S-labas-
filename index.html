<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Alfabetização - Arraste a Sílaba</title>
</head>
<body>

    <main id="game-wrapper">
        <div id="imagem-pergunta">
            <img src="placeholder.png" alt="O que é isso?" id="display-imagem">
        </div>

        <div id="zona-destino">
            <div id="slot-vazio" class="drop-target">?</div>
            <span id="parte-existente-palavra">LA</span>
        </div>

        <div id="opcoes-silabas">
            <button class="btn-silaba" draggable="true" id="opt1">BA</button>
            <button class="btn-silaba" draggable="true" id="opt2">BE</button>
            <button class="btn-silaba" draggable="true" id="opt3">BO</button>
            <button class="btn-silaba" draggable="true" id="opt4">BU</button>
        </div>

        <div id="feedback-visual"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

</body>
</html>
